name: Build APK
run-name: APK build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      url:
        required: true
      package:
        required: true
      app_name:
        required: true
      icon_b64:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap and ImageMagick
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Prepare project files
        env:
          SITE_URL: ${{ inputs.url }}
          PKG: ${{ inputs.package }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_B64: ${{ inputs.icon_b64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'kairo-temp-pass' }}
        run: |
          mkdir app && cd app
          echo "$ICON_B64" | base64 -d > icon_src
          convert icon_src -resize 512x512 icon.png

          cat > gen.js << 'JS'
          const u = new URL(process.env.SITE_URL);
          if (u.protocol !== "https:") throw new Error("HTTPS only");
          if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(process.env.PKG)) throw new Error("Bad package");
          const name = process.env.APP_NAME.slice(0, 30);
          const dark = "#07090d";
          const m = {
            packageId: process.env.PKG,
            host: u.host,
            name: name,
            launcherName: name.slice(0, 15),
            display: "standalone",
            themeColor: dark, themeColorDark: dark,
            navigationColor: dark, navigationColorDark: dark,
            navigationDividerColor: dark, navigationDividerColorDark: dark,
            backgroundColor: dark,
            enableNotifications: false,
            startUrl: u.pathname + u.search,
            iconUrl: "http://localhost:8099/icon.png",
            maskableIconUrl: "http://localhost:8099/icon.png",
            appVersion: "1", appVersionName: "1.0.0", appVersionCode: 1,
            signingKey: { path: "./android.keystore", alias: "android" },
            splashScreenFadeOutDuration: 300,
            fallbackType: "customtabs",
            enableSiteSettingsShortcut: true,
            isChromeOSOnly: false,
            isMetaQuest: false,
            orientation: "default",
            minSdkVersion: 24,
            shortcuts: [],
            features: {},
            alphaDependencies: { enabled: false },
            generatorApp: "bubblewrap-cli"
          };
          require("fs").writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          JS
          node gen.js

          KS_FILE=".github/keystore/keystore.enc"
          cd "$GITHUB_WORKSPACE"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/android.keystore
          elif [ -n "$KS_SECRET" ]; then
            if [ -f "$KS_FILE" ]; then
              echo "Reusing saved signing key"
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KS_SECRET -in "$KS_FILE" -out app/android.keystore
            else
              echo "Creating a new signing key (first build)"
              keytool -genkeypair -keystore app/android.keystore -alias android -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$KS_SECRET" -keypass "$KS_SECRET" -dname "CN=Kairo, O=Kairo, C=US"
              mkdir -p .github/keystore
              openssl enc -aes-256-cbc -pbkdf2 -pass env:KS_SECRET -in app/android.keystore -out "$KS_FILE"
              git config user.name "kairo-bot"
              git config user.email "kairo-bot@users.noreply.github.com"
              git add "$KS_FILE"
              git commit -m "Save encrypted signing key"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "WARNING: KEYSTORE_PASSWORD secret not set. Using a temporary key. The key will change every build."
            keytool -genkeypair -keystore app/android.keystore -alias android -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Kairo, O=Kairo, C=US"
          fi

      - name: Configure Bubblewrap and Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          ls -la "$SDK"

      - name: Build APK
        working-directory: app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'kairo-temp-pass' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'kairo-temp-pass' }}
        run: |
          python3 -m http.server 8099 > /dev/null 2>&1 &
          sleep 2
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Show assetlinks.json to copy
        working-directory: app
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'kairo-temp-pass' }}
          PKG: ${{ inputs.package }}
          SITE_URL: ${{ inputs.url }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" | grep "SHA256" | head -1 | awk '{print $2}')
          JSON="[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"android_app\",\"package_name\":\"$PKG\",\"sha256_cert_fingerprints\":[\"$FP\"]}}]"
          echo "$JSON" > assetlinks.json
          {
            echo "### SHA-256 fingerprint"
            echo '```'
            echo "$FP"
            echo '```'
            echo "### Put this at /.well-known/assetlinks.json on $SITE_URL"
            echo '```json'
            echo "$JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: |
            app/app-release-signed.apk
            app/assetlinks.json
          retention-days: 1
