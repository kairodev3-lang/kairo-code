
name: Build APK
run-name: build-${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Build id
        required: true
      url:
        description: Site URL
        required: true
      name:
        description: App name
        required: true
      pkg:
        description: Package name
        required: true
      icon:
        description: Icon PNG base64
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IN_ID: ${{ inputs.id }}
      IN_URL: ${{ inputs.url }}
      IN_NAME: ${{ inputs.name }}
      IN_PKG: ${{ inputs.pkg }}
      IN_ICON: ${{ inputs.icon }}
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate inputs
        run: |
          set -euo pipefail
          grep -Eq '^[a-z0-9]{6,20}$' <<<"$IN_ID" || { echo "Bad id"; exit 1; }
          grep -Eq '^https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$' <<<"$IN_URL" || { echo "Bad URL"; exit 1; }
          [ "${#IN_URL}" -le 300 ] || { echo "URL too long"; exit 1; }
          grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' <<<"$IN_PKG" || { echo "Bad package"; exit 1; }
          NAME=$(printf '%s' "$IN_NAME" | tr -cd 'A-Za-z0-9 ._-' | cut -c1-30)
          [ -n "$NAME" ] || NAME=App
          SLUG=$(printf '%s' "$NAME" | tr 'A-Z ' 'a-z-' | tr -cd 'a-z0-9-')
          [ -n "$SLUG" ] || SLUG=app
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          set -euo pipefail
          mkdir -p proj/app/src/main/java/com/kairo/wrapper
          cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "app"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.kairo.wrapper'
            compileSdk 34
            defaultConfig {
              applicationId project.property('APP_ID')
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName '1.0.0'
              buildConfigField 'String', 'START_URL', '"' + project.property('APP_URL') + '"'
              resValue 'string', 'app_name', project.property('APP_NAME')
            }
            buildFeatures { buildConfig true }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'kairo'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
            lint { checkReleaseBuilds false; abortOnError false }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:allowBackup="false"
              android:usesCleartextTraffic="false"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                android:name="com.kairo.wrapper.MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/kairo/wrapper/MainActivity.java <<'EOF'
          package com.kairo.wrapper;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            WebView web;
            final String home = BuildConfig.START_URL;

            void openExternal(Uri u) {
              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.setDownloadListener((u, ua, cd, mt, len) -> openExternal(Uri.parse(u)));
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String host = Uri.parse(home).getHost();
                  if (u.getHost() != null && u.getHost().equals(host)) return false;
                  openExternal(u);
                  return true;
                }
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    v.loadData("<body style='font-family:sans-serif;text-align:center;padding:40px;background:#111;color:#eee'><h2>No connection</h2><p>Check your internet and try again.</p><button onclick=\"location.href='" + home + "'\">Retry</button></body>", "text/html", "UTF-8");
                  }
                }
              });
              web.loadUrl(home);
            }

            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Make icons
        run: |
          set -euo pipefail
          cd proj
          rm -f icon.png
          if [ -n "$IN_ICON" ]; then printf '%s' "$IN_ICON" | base64 -d > icon.png 2>/dev/null || rm -f icon.png; fi
          if [ -f icon.png ] && ! identify icon.png >/dev/null 2>&1; then rm -f icon.png; fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="app/src/main/res/mipmap-${d%%:*}"; sz="${d##*:}"
            mkdir -p "$dir"
            if [ -f icon.png ]; then convert icon.png -resize "${sz}x${sz}!" "$dir/ic_launcher.png"
            else convert -size "${sz}x${sz}" 'xc:#8b5cf6' "$dir/ic_launcher.png"; fi
          done

      - name: Keystore
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            PASS="$KS_PASS_SECRET"
            echo "::add-mask::$PASS"
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          else
            PASS=$(openssl rand -hex 12)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storepass "$PASS" -keypass "$PASS" -alias kairo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KAIRO DEV" >/dev/null 2>&1
          fi
          echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: proj
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          gradle assembleRelease --no-daemon -PAPP_ID="$IN_PKG" -PAPP_NAME="$NAME" -PAPP_URL="$IN_URL"

      - name: Publish APK
        run: |
          set -euo pipefail
          cp proj/app/build/outputs/apk/release/app-release.apk "$SLUG.apk"
          gh release create "build-$IN_ID" "$SLUG.apk" --repo "$GITHUB_REPOSITORY" --title "$NAME" --notes "$IN_PKG"
